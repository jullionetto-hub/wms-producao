name: Testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # O .npmrc do projeto tem "omit=dev" (pensado pro deploy de produção no
      # Railway não instalar jest/supertest/nodemon à toa) — aqui no CI a gente
      # PRECISA dessas dependências pra rodar os testes, então inclui de propósito.
      - name: Instalar dependências
        run: npm ci --include=dev

      # bcrypt é módulo nativo (binário compilado, não JS puro) — o binário
      # pré-compilado que resolve certo localmente no Windows não necessariamente
      # cobre o Linux do runner do GitHub, e o próprio npm avisou (rodando local)
      # que o script de instalação do bcrypt estava sendo pulado por política de
      # segurança de scripts. Reconstrói explicitamente pra garantir o binário
      # certo pra esta plataforma antes de rodar os testes.
      - name: Reconstruir módulos nativos (bcrypt)
        run: npm rebuild bcrypt

      - name: Rodar testes
        run: npm test

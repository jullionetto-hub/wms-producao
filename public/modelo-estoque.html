<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Modelo do Estoque Vertical</title>
<style>
:root{
  --bg:#0f1317;--panel:#171d23;--panel2:#1e262e;--line:#2b3641;--txt:#e8edf2;--mut:#93a0ad;
  --acc:#f28a1c;--blue:#2b63d9;--ok:#2fb344;--red:#e0262d;--yel:#f5d90a;
}
:root[data-theme="light"]{
  --bg:#eef1f4;--panel:#ffffff;--panel2:#f3f5f7;--line:#d5dbe1;--txt:#1b242c;--mut:#5c6a77;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){--bg:#eef1f4;--panel:#ffffff;--panel2:#f3f5f7;--line:#d5dbe1;--txt:#1b242c;--mut:#5c6a77}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button,input{font:inherit;color:inherit}
header{position:fixed;inset:0 0 auto 0;z-index:20;display:flex;gap:10px;align-items:center;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font-size:15px;margin:0 8px 0 0;white-space:nowrap}
h1 small{display:block;font-weight:400;color:var(--mut);font-size:11px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer;white-space:nowrap}
.tab[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#1a1004;font-weight:600}
.search{margin-left:auto;display:flex;gap:6px}
.search input{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;width:150px;text-transform:uppercase}
.search button{background:var(--blue);border:0;border-radius:8px;color:#fff;padding:6px 12px;cursor:pointer}
#stage{position:fixed;inset:0;top:var(--hh,56px)}
canvas{display:block}
#c3{position:absolute;inset:0;width:100%;height:100%;touch-action:none;outline:none}
#c2{position:absolute;inset:0;width:100%;height:100%;display:none;background:#f4f5f2;touch-action:none}
.card{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
#side{left:10px;top:10px;width:230px;max-height:calc(100% - 20px);overflow:auto}
#side h3{margin:0 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.chip{min-width:30px;text-align:center;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:3px 6px;cursor:pointer;font-weight:600}
.chip:hover,.chip.on{background:var(--acc);color:#1a1004;border-color:var(--acc)}
.chip.fr{border-color:var(--blue)}
label.tg{display:flex;gap:7px;align-items:center;padding:3px 0;cursor:pointer;color:var(--txt)}
.leg{display:grid;gap:4px;margin-top:8px;font-size:12px;color:var(--mut)}
.leg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-2px}
#info{right:10px;top:10px;width:272px;display:none}
#info h2{margin:0 0 2px;font-size:22px;letter-spacing:.02em}
#info dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:8px 0}
#info dt{color:var(--mut)} #info dd{margin:0;font-weight:600}
#info .row{display:flex;gap:6px;margin-top:8px}
#info button{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px;cursor:pointer}
#info button.pri{background:var(--blue);border-color:var(--blue);color:#fff}
#info .tiny{font-size:11px;color:var(--mut);margin-top:6px}
#mini{right:10px;bottom:10px;padding:6px}
#mini canvas{width:260px;height:150px;border-radius:8px}
#hint{left:50%;bottom:10px;transform:translateX(-50%);font-size:12px;color:var(--mut);padding:6px 12px;text-align:center;max-width:calc(100% - 300px)}
#tip{position:absolute;pointer-events:none;background:#000c;color:#fff;border-radius:6px;padding:3px 8px;font-size:12px;display:none;white-space:nowrap}
#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--red);color:#fff;border-radius:8px;padding:6px 14px;display:none}
#pad{position:absolute;left:12px;bottom:12px;display:none;grid-template-columns:repeat(3,46px);gap:4px}
#pad button{height:46px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:18px}
#load{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;text-align:center}
#load b{font-size:18px}
@media (max-width:900px){
  #side{width:190px}#mini{display:none}#hint{max-width:calc(100% - 20px);bottom:62px}
  #pad{display:grid}.search{margin-left:0;width:100%}.search input{flex:1}
  #info{top:auto;bottom:70px;right:10px;left:10px;width:auto}
}
</style>
</head>
<body>
<div id="load"><div><b>Montando o estoque…</b><div style="color:var(--mut);margin-top:6px">gerando prateleiras, cestos e produtos</div></div></div>

<header id="hd">
  <h1>Estoque Vertical<small>Layout porta-pallets · módulos C e D · projeto 112421A4</small></h1>
  <div class="tabs" role="group" aria-label="Modo de visualização">
    <button class="tab" data-mode="walk" aria-pressed="true">🚶 Caminhar</button>
    <button class="tab" data-mode="orbit" aria-pressed="false">🎥 Orbital</button>
    <button class="tab" data-mode="aerial" aria-pressed="false">🛰 Aérea</button>
    <button class="tab" data-mode="plan" aria-pressed="false">🗺 Planta 2D</button>
  </div>
  <form class="search" id="sf" autocomplete="off">
    <input id="q" placeholder="Endereço: T120" aria-label="Buscar endereço">
    <button>Ir</button>
  </form>
</header>

<div id="stage">
  <canvas id="c3" tabindex="0"></canvas>
  <canvas id="c2"></canvas>

  <div class="card" id="side">
    <h3>Ruas — fundo</h3>
    <div class="chips" id="chFundo"></div>
    <h3>Ruas — frente</h3>
    <div class="chips" id="chFrente"></div>
    <h3>Exibir</h3>
    <label class="tg"><input type="checkbox" id="tgItens" checked> Produtos nos cestos</label>
    <label class="tg"><input type="checkbox" id="tgCaixas" checked> Caixas no topo</label>
    <label class="tg"><input type="checkbox" id="tgTeto" checked> Teto e luminárias</label>
    <label class="tg"><input type="checkbox" id="tgParedes" checked> Paredes</label>
    <label class="tg"><input type="checkbox" id="tgPlaca" checked> Placas das ruas</label>
    <div class="leg">
      <div><i style="background:#1fa21f"></i>Módulo C · 2300×950 · cesto 575×410×275 · 8 níveis</div>
      <div><i style="background:#e0141c"></i>Módulo D · 2300×850 · cesto 435×340×245 · 9 níveis</div>
      <div><i style="background:#2b63d9"></i>Montantes / <i style="background:#f28a1c;margin-left:4px"></i>longarinas</div>
    </div>
    <div class="leg" id="stats"></div>
  </div>

  <div class="card" id="info"></div>
  <div class="card" id="mini"><canvas id="cm" width="520" height="300"></canvas></div>
  <div class="card" id="hint"></div>
  <div id="tip"></div>
  <div id="toast"></div>
  <div id="pad">
    <span></span><button data-k="f">▲</button><span></span>
    <button data-k="l">◀</button><button data-k="b">▼</button><button data-k="r">▶</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

/* ════════════════ 1. DADOS — transcritos do PDF (planta 1:200, medidas em mm) ════════════════ */
// Conversão pixel da planta renderizada (3640 px de largura) → metros. 2300 mm = 135,6 px.
const K = 0.017036, X0 = 991, Y0 = 1043;
const mx = p => (p - X0) * K, mz = p => (p - Y0) * K;   // x: leste · z: sul (planta para baixo)

const TIPOS = {
  // bw/bd/bh = cesto plástico existente; pitch = passo ao longo da longarina; tp = passo vertical
  C: { depth:.95, bd:.41, bw:.55,  bh:.27,  pitch:.575, tiers:8, cols:4, tp:.25,  r:.045, cor:'#1fa21f', nome:'Módulo C' },
  D: { depth:.85, bd:.345,bw:.43,  bh:.245, pitch:.46,  tiers:9, cols:5, tp:.225, r:.036, cor:'#e0141c', nome:'Módulo D' }
};
const TILT = 0.245;      // inclinação do cesto (rad ≈ 14°)
const MOD_L = 2.3;       // comprimento do módulo (2300 mm)

// Ruas do fundo. Cada porta-pallet é identificado pela rua à sua direita; a esquerda do 1º é a rua Z.
// up = bloco norte (acima da linha tracejada), lo = bloco sul. top em px da planta (relativo ao recorte c1).
// t = tipo, c = nº de módulos, s = cestos do módulo curto (ponta junto à viga), g = folga em px, x = módulos extras parciais.
const FUNDO = [
  ['Y', 991, {top:150,t:'D',c:3},                 {top:632,t:'D',c:1}],
  ['X',1123, {top:150,t:'D',c:3},                 {top:632,t:'D',c:1}],
  ['W',1245, {top:175,t:'D',c:2,s:4,g:3},         {top:632,t:'D',c:2}],
  ['V',1394, {top:198,t:'D',c:2,s:3,g:5},         {top:628,t:'C',c:2}],
  ['U',1521, {top:85, t:'D',c:3,s:3,g:5},         {top:628,t:'C',c:2}],
  ['T',1647, {top:90, t:'C',c:3,s:1,g:6},         {top:628,t:'C',c:2}],
  ['S',1779, {top:65, t:'C',c:3,s:1,g:5},         {top:628,t:'C',c:2}],
  ['R',1910, {top:90, t:'C',c:3,s:1,g:6},         {top:628,t:'C',c:2}],
  ['Q',2061, {top:90, t:'C',c:3,s:1,g:6},         {top:628,t:'C',c:2}],
  ['P',2198, {top:90, t:'C',c:3},                 {top:628,t:'C',c:2}],
  ['O',2331, {top:90, t:'C',c:3,s:1,g:6},         {top:628,t:'C',c:2}],
  ['N',2481, {top:90, t:'C',c:3,s:1,g:6},         {top:628,t:'C',c:2}],
  ['M',2640, {top:90, t:'C',c:3},                 {top:628,t:'C',c:2}],
  ['L',2768, {top:90, t:'C',c:3,s:1,g:6},         {top:628,t:'C',c:2}],
  ['K',2902, {top:90, t:'C',c:3,s:1,g:6},         {top:628,t:'C',c:2}],
  ['J',3035, {top:90, t:'C',c:3},                 {top:628,t:'C',c:2}],
  ['I',3168, {top:90, t:'C',c:3,s:1,g:6},         {top:628,t:'C',c:2}],
  ['H',3260, null,                                {top:632,t:'D',c:1,x:[{n:2}]}],
  ['G',3352, null,                                {top:632,t:'D',c:1,x:[{n:2}]}],
  ['F',3445, null,                                {top:632,t:'D',c:1}]
];
const Y_BASE = 978;      // offset vertical do recorte
// Pilares (quadrados na linha tracejada) e viga aérea
const PILARES = [1310,1756,2198,2640,3035];
const VIGA_Y = 1502;
// Contorno do galpão + ramal da frente (A–E), em px absolutos
const CONTORNO_PX = [[1323,961],[1512,961],[1512,397],[2157,397],[2157,961],[3312,961],[3312,1498],[3517,1498],[3517,1995],
  [1161,1995],[1161,1915],[1091,1915],[1091,1835],[863,1835],[863,1043],[1241,1043],[1241,1115],[1323,1115]];
const CONTORNO = CONTORNO_PX.map(p => [mx(p[0]), mz(p[1])]);
const PE = 6.2;          // pé-direito (m)

const racks = [];
function sect(cfg, sec){
  const T = TIPOS[cfg.t], mods = [];
  for (let i = 0; i < cfg.c; i++) mods.push({ t:cfg.t, L:MOD_L, n:T.cols, al:'s' });
  (cfg.x || []).forEach(e => mods.push({ t:cfg.t, L:MOD_L, n:e.n, al:'s', parcial:true }));
  if (cfg.s) mods.push({ t:cfg.t, L:cfg.s * T.pitch + .06, n:cfg.s, gap:cfg.g * K, al:'c', curto:true });
  return mods;
}
function addRack(o){
  let a = 0;
  o.mods.forEach(m => { a += (m.gap || 0); m.a = a; a += m.L; });
  o.len = a; o.depth = TIPOS[o.mods[0].t].depth; racks.push(o);
}
FUNDO.forEach((R, i) => {
  const neg = i ? FUNDO[i-1][0] : 'Z', pos = R[0];
  [['N',R[2]],['S',R[3]]].forEach(([sec, cfg]) => {
    if (!cfg) return;
    addRack({ axis:'z', c:mx(R[1]), a0:mz(Y_BASE + cfg.top), neg, pos, grupo:'Fundo', sec, mods:sect(cfg) });
  });
});
// Ramal da frente: 4 fileiras horizontais de 3 módulos C → ruas A (norte) … E (sul)
[515,650,782,917].forEach((top, r) => {
  const mods = [0,1,2].map(() => ({ t:'C', L:MOD_L, n:4, al:'s' }));
  if (r === 3) { mods[0].n = 3; mods[0].al = 'e'; mods[0].parcial = true; }
  addRack({ axis:'x', c:mz(top + 27.5), a0:mx(1630), neg:'ABCDE'[r], pos:'ABCDE'[r+1], grupo:'Frente', sec:'F', mods });
});

/* ── cestos (endereços) ── */
const cestos = [];       // um registro por cesto
racks.forEach((rk, ri) => {
  rk.mods.forEach((m, mi) => {
    const T = TIPOS[m.t];
    const off = m.al === 's' ? 0 : m.al === 'e' ? m.L - m.n * T.pitch : (m.L - m.n * T.pitch) / 2;
    for (let face = 0; face < 2; face++) {
      const side = face ? 1 : -1;
      const corr = face ? rk.pos : rk.neg;
      for (let j = 0; j < m.n; j++) {
        const along = rk.a0 + m.a + off + (j + .5) * T.pitch;
        for (let t = 0; t < T.tiers; t++) {
          const r = { rk:ri, mod:mi, tipo:m.t, face, side, corr, col:j, tier:t, along, y:.02 + t * T.tp };
          if (rk.axis === 'z') { r.x = rk.c + side * .012; r.z = along; r.rot = face ? 0 : Math.PI; }
          else                 { r.z = rk.c + side * .012; r.x = along; r.rot = face ? -Math.PI/2 : Math.PI/2; }
          cestos.push(r);
        }
      }
    }
  });
});
// numeração por rua: do norte para o sul (ou oeste→leste), lado oeste/norte primeiro
const porRua = {};
cestos.forEach(c => (porRua[c.corr] = porRua[c.corr] || []).push(c));
const ORD_SEC = { F:0, N:1, S:2 };
const byAddr = {};
Object.keys(porRua).forEach(k => {
  const arr = porRua[k];
  arr.sort((a, b) => (ORD_SEC[racks[a.rk].sec] - ORD_SEC[racks[b.rk].sec]) ||
    (Math.round(a.along * 100) - Math.round(b.along * 100)) || (a.face - b.face) || (a.tier - b.tier));
  arr.forEach((c, i) => { c.num = i + 1; c.addr = k + String(i + 1).padStart(3, '0'); byAddr[c.addr] = c; });
});
const CORREDORES = Object.keys(porRua).sort((a,b) => 'ABCDE'.includes(a) === 'ABCDE'.includes(b) ? 0 : 0);

// produtos de exemplo (determinísticos) — o modelo não lê o banco do WMS
const PRODUTOS = ['Bomba de banho','Sabonete esfoliante','Hidratante corporal','Sais de banho','Vela aromática','Body splash','Creme para mãos','Óleo corporal','Espuma de banho','Máscara facial','Kit presente','Difusor de ambiente'];
const AROMAS = ['Lavanda','Morango','Baunilha','Algodão doce','Coco','Frutas vermelhas','Jasmim','Maçã verde','Pêssego','Cereja'];
function hash(s){ let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rnd(seed){ let s = seed >>> 0; return () => ((s = Math.imul(s ^ s >>> 15, 2246822507) + 0x6d2b79f5 >>> 0) / 4294967296); }
cestos.forEach(c => {
  const R = rnd(hash(c.addr));
  c.vazio = R() < .14;
  c.kind = R() < .72 ? 'bomb' : (R() < .6 ? 'red' : 'pack');
  c.sku = 'MS-' + String(1000 + (hash(c.addr + 's') % 8999));
  c.prod = PRODUTOS[hash(c.addr + 'p') % PRODUTOS.length] + ' ' + AROMAS[hash(c.addr + 'a') % AROMAS.length];
  c.qtd = c.vazio ? 0 : 6 + (hash(c.addr + 'q') % 90);
});

/* ── geometria das ruas (para 2D, colisão e câmera) ── */
const corrInfo = {};     // letra → {zonas:[{x0,x1,z0,z1,sec}], cx, n}
function bbox(rk){
  const a0 = rk.a0, a1 = rk.a0 + rk.len, h = rk.depth / 2;
  return rk.axis === 'z' ? { x0:rk.c - h, x1:rk.c + h, z0:a0, z1:a1 } : { x0:a0, x1:a1, z0:rk.c - h, z1:rk.c + h };
}
racks.forEach(rk => {
  const b = bbox(rk);
  const reg = (letra, face) => {
    const ci = corrInfo[letra] = corrInfo[letra] || { letra, zonas:[], n:0, frente:'ABCDE'.includes(letra) };
    let z;
    if (rk.axis === 'z') z = face ? { x0:b.x1, x1:b.x1 + 1.3, z0:b.z0, z1:b.z1 } : { x0:b.x0 - 1.3, x1:b.x0, z0:b.z0, z1:b.z1 };
    else                 z = face ? { x0:b.x0, x1:b.x1, z0:b.z1, z1:b.z1 + 1.3 } : { x0:b.x0, x1:b.x1, z0:b.z0 - 1.3, z1:b.z0 };
    z.sec = rk.sec; z.axis = rk.axis; z.face = face; ci.zonas.push(z);
  };
  reg(rk.neg, 0); reg(rk.pos, 1);
});
cestos.forEach(c => corrInfo[c.corr].n++);
// ponto de entrada de cada rua (extremo norte/oeste da 1ª seção)
function entradaRua(letra, secPref){
  const zs = corrInfo[letra].zonas.filter(z => !secPref || z.sec === secPref);
  const z = (zs.length ? zs : corrInfo[letra].zonas).slice().sort((a, b) => (a.z0 - b.z0) || (a.x0 - b.x0))[0];
  if (z.axis === 'z') return { x:(z.x0 + z.x1) / 2, z:z.z0 - 1.0, yaw:Math.PI };
  return { x:z.x0 - 1.0, z:(z.z0 + z.z1) / 2, yaw:-Math.PI / 2 };
}

/* ════════════════ 2. CENA 3D ════════════════ */
const cv3 = document.getElementById('c3');
const renderer = new THREE.WebGLRenderer({ canvas:cv3, antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1f25);
scene.fog = new THREE.Fog(0x1a1f25, 22, 70);
const camera = new THREE.PerspectiveCamera(68, 1, .05, 220);

scene.add(new THREE.HemisphereLight(0xe8f0ff, 0x6b6762, .95));
const sun = new THREE.DirectionalLight(0xffffff, .55); sun.position.set(-8, 20, 6); scene.add(sun);
const sun2 = new THREE.DirectionalLight(0xfff2dd, .3); sun2.position.set(10, 12, -14); scene.add(sun2);

const M = c => new THREE.MeshLambertMaterial({ color:c });
const MAT = { azul:M(0x1f4fc4), laranja:M(0xf28a1c), madeira:M(0xcaa36c), preto:M(0x15181c), cesto:M(0x1b1e23), cinza:M(0x8a9199), parede:M(0xaab3bc), concreto:M(0x888d92) };

function boxG(w, h, d, x, y, z, rx, ry, rz){
  const g = new THREE.BoxGeometry(w, h, d);
  const m = new THREE.Matrix4().compose(new THREE.Vector3(x, y, z),
    new THREE.Quaternion().setFromEuler(new THREE.Euler(rx || 0, ry || 0, rz || 0)), new THREE.Vector3(1, 1, 1));
  g.applyMatrix4(m); return g;
}
function mergeG(list){
  let nv = 0, ni = 0;
  list.forEach(g => { nv += g.attributes.position.count; ni += g.index.count; });
  const pos = new Float32Array(nv * 3), nor = new Float32Array(nv * 3), uv = new Float32Array(nv * 2), idx = new Uint32Array(ni);
  let ov = 0, oi = 0;
  list.forEach(g => {
    pos.set(g.attributes.position.array, ov * 3); nor.set(g.attributes.normal.array, ov * 3); uv.set(g.attributes.uv.array, ov * 2);
    const gi = g.index.array; for (let i = 0; i < gi.length; i++) idx[oi + i] = gi[i] + ov;
    ov += g.attributes.position.count; oi += gi.length; g.dispose();
  });
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  out.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  out.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  out.setIndex(new THREE.BufferAttribute(idx, 1));
  return out;
}

/* texturas procedurais */
function tex(w, h, draw, rep){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping;
  if (rep) t.repeat.set(rep[0], rep[1]);

}

['Z','Y','X','W','V','U','T','S','R','Q','P','O','N','M','L','K','J','I','H','G','F'].forEach(l => mkChip(l, $('chFundo')));
['A','B','C','D','E'].forEach(l => mkChip(l, $('chFrente'), true));
{
  const nm = cestos.length, nmod = racks.reduce((s, r) => s + r.mods.length, 0), nc = cestos.filter(c => c.tipo === 'C').length;
  $('stats').innerHTML = `<div><b>${racks.length}</b> porta-pallets · <b>${nmod}</b> módulos</div><div><b>${nm.toLocaleString('pt-BR')}</b> cestos (<b>${nc.toLocaleString('pt-BR')}</b> C · <b>${(nm - nc).toLocaleString('pt-BR')}</b> D)</div><div><b>${Object.keys(corrInfo).length}</b> ruas · A–E frente, F–Z fundo</div>`;
}
function toast(t){ const e = $('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => e.style.display = 'none', 2600); }
$('sf').onsubmit = e => {
  e.preventDefault();
  const q = $('q').value.trim().toUpperCase().replace(/[\s-]/g, ''), m = q.match(/^([A-Z])(\d{1,4})$/);
  if (m) { const a = m[1] + String(m[2]).padStart(3, '0'), c = byAddr[a]; if (c) { selecionar(c, true); return; } }
  if (/^[A-Z]$/.test(q) && corrInfo[q]) { irRua(q); return; }
  toast('Endereço não encontrado: ' + q);
};
$('q').placeholder = 'Endereço: T120 ou rua';

function redim(){
  const hh = $('hd').offsetHeight; document.documentElement.style.setProperty('--hh', hh + 'px');
  const st = $('stage').getBoundingClientRect();
  renderer.setSize(st.width, st.height, false); camera.aspect = st.width / st.height; camera.updateProjectionMatrix();
  if (cam.modeUI === 'plan') { ajusta2D(); }
}
addEventListener('resize', redim); redim();

let last = performance.now(), mmT = 0;
function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  if (cam.modeUI === 'plan') { render2D(); return; }
  animFly(dt); passo(dt); aplicarCamera();
  renderer.render(scene, camera);
  if (now - mmT > 120) { mmT = now; const c = cm.getContext('2d'); desenhar(c, cm.width, cm.height, { s:cm.width / (bb.x1 - bb.x0 + 3), ox:centro.x, oz:centro.z }, { mini:true, cam:{ x:cam.mode === 'walk' ? cam.x : cam.tx, z:cam.mode === 'walk' ? cam.z : cam.tz, yaw:cam.mode === 'walk' ? cam.yaw : cam.oyaw } }); }
}
setMode('walk'); mostrar('walk');
{ const e = entradaRua('T', 'S'); cam.x = e.x; cam.z = e.z; cam.yaw = e.yaw; cam.pitch = -.04; }
requestAnimationFrame(loop);
$('load').style.display = 'none';
window.__estoque = { cestos, racks, byAddr, corrInfo, cam, irPara, irRua, mostrar, selecionar };
